[package]
name = "nextburn"
version = "1.0.0"
edition = "2024"
authors = ["Shay Kadosh"]
description = "Production-Grade Linux & Windows 10/11 UEFI USB Creator (wxWidgets GUI & CLI)"

[[bin]]
name = "nextburn"
path = "src/main.rs"

[[bin]]
name = "nextburn-gui"
path = "src/gui.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
libc = "0.2"
wxdragon = "0.9"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
